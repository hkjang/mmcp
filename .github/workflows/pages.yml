name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced screenshots exist
        run: |
          missing=0
          for f in $(grep -oE 'screenshots/[a-z0-9-]+\.webp' docs/index.html docs/*.md docs/*-guide.html 2>/dev/null | cut -d: -f2 | sort -u); do
            [ -s "docs/$f" ] || { echo "missing docs/$f"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
