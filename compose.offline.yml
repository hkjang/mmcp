# Offline deployment: docker load -i mmcp-v1.0.1.tar.gz && docker compose -f compose.offline.yml up -d
services:
  mmcp:
    image: mmcp:v1.0.1
    container_name: mmcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
